name: Code Style Check

on:
  pull_request:
    branches: ["develop"]

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python and poly
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python github:Goldziher/poly

      - name: Format check
        run: poly fmt --check .

      - name: Lint
        run: poly lint .
