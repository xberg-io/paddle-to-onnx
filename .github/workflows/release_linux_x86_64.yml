name: LinuxRelease_x86_64

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        architecture: ["x86_64"]

    steps:
      - name: Checkout Paddle2ONNX
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build on manylinux_2_28_x86_64
        uses: docker://quay.io/pypa/manylinux_2_28_x86_64:latest
        with:
          entrypoint: bash
          args: .github/workflows/scripts/entrypoint.sh ${{ matrix.python-version }}

      - uses: actions/upload-artifact@v7
        with:
          name: LinuxRelease_${{ matrix.architecture }}_py${{ matrix.python-version }}
          path: dist

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          user: __token__
          password: ${{ secrets.PADDLE2ONNX_API_TOKEN }}
