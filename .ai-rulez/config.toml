
version = "5.0"
name = 'Paddle2ONNX'
description = 'Convert PaddlePaddle models to ONNX format'
gitignore = true
gitignore_exclude = [".ai-rulez/.generated-manifest.json"]
presets = ["claude", "codex", "opencode", "pi"]
builtins = ["!git-workflow", 'python', 'default-commands']

compact = true
default_layers = ["plugins"]

[header]
style = 'minimal'

[[includes]]
name = 'xberg-core'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "2011d3db223de5b1c8b35f602ec6f2d2a7b62bf8"
path = 'modules/core'
merge_strategy = 'local-override'

[mcp]
self_server = false

[[mcp_servers]]
name = "playwright"
command = "npx"
args = ["-y", "@playwright/mcp@0.0.83"]

[lock]
include_outputs = false

[lint]
allow_overrides = ["python-conventions"]
